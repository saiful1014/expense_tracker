name: test_new_things
description: "A Flutter app for tracking daily expenses."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.0
  provider: ^6.1.1
  go_router: ^17.3.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  pdf: ^3.11.1
  printing: ^5.12.1
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  deferred-components:
    - name: borrowLendComponent
      libraries:
        - package:test_new_things/ui/features/borrow_lend/views/borrow_lend_screen.dart

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2196F3"
  remove_alpha_ios: true
